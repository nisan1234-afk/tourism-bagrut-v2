name: CI (frontend)

# בכל push ו-PR: תחביר (check), תקן היחידות (standard), עשן בדפדפן על כל הדפים (smoke),
# והתנהגות המנוע המשותף בכל יחידה (behavior). ר' docs/UNIT_TEMPLATE.md.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run standard
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run behavior
