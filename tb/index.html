  <script>
    (function () {
      var hub = 'https://nisan1234-afk.github.io/';
      try {
        var user = JSON.parse(sessionStorage.getItem('kitahUser') || 'null');
        if (!user || !user.token) { location.replace(hub + '?return=' + encodeURIComponent(location.href)); return; }
        document.documentElement.classList.add('page-authorized');
      } catch (_) { location.replace(hub); }
    }());
  </script>

</head>
